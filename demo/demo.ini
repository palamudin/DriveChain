; DriveChain test-drive configuration (paths are relative to the working directory)
[car]
ini = cars/mx5_na.ini         ; physical car (hardpoints, springs, tyres, steering, engine). The private dist build may point at a privately calibrated car file
mesh_dir = private/miata_mesh  ; prepared by tools/prep_car_mesh.py (private, not in the repo); missing -> placeholder components
assist = -1                    ; -1 = from car ini, 0 = manual rack, 1 = hydraulic assist (H toggles live)
setup = default                ; default = car file + proposal sets: propBR bushings and rack mount (MB-core cars, docs/BUSHINGS.md) and TARMAC tyre propD (185/60R14 cars, docs/TYRE_DATA.md) | legacy = car file as-is (or --set car.setup=legacy)

[physics]
tick_hz = 960                  ; host physics tick: input, force feedback and audio update this often. 960 = default; slower PC: 480 or 240
model = fast                   ; fast (default) = same physics with bounded solver work (docs/PERF.md) | reference = full numerics
substeps = 4                   ; mechanics substeps per tick; mechanics rate = tick_hz x substeps (960 x 4 = 3840 Hz). Slower PC: 2 or 1
threads = 4                    ; worker threads in the physics step, 1-4 (results are bit-identical for any count)
perf_log = 0                   ; 1 = print physics cost once per simulated second
; substep_hz = 2000            ; optional: set the mechanics rate in Hz directly (overrides substeps)

[offload]
patch = auto                   ; fast model's tyre-patch rays: auto (pick the fastest bit-identical backend on live batches) | cpu | cpu_simd | gpu (OpenCL) | ref (double rays)
xcheck = 0                     ; 0 = off; N = every Nth lane batch is re-run on the plain CPU path the same tick and compared (F7 / F8: flips, max diffs). Diagnostic, costs time.

[replay]
; F9 records the inputs (flying restart from the current pose and speed); F9 again stops and writes replay_YYYYmmdd_HHMMSS.dcr next to the exe.
; file = replay_20261030_183000.dcr   ; replay this recording from its start pose; F9 restarts it, the end hash is checked against the recording
dump = 1                       ; write the F8 perf dump automatically when a replay ends
max_s = 600                    ; recording buffer, seconds
record = 0                     ; 1 = record from the spawn
; record_file = my_run.dcr      ; fixed output name instead of the timestamped one

[start]
spot = hub       ; hub | start | skidpad | pave | undulations | oval | slalom | bumps | ruts | bumpy_corner (keys 1-9, 0); remove to use s/d
s = 30          ; metres along the lap (used when spot is unset)
d = 0           ; lateral offset (+ = left)
speed = 0

[track]
rough_scale = 1.0
layout = proving               ; proving | circuit | a mesh map folder | <name> under maps_dir (F6 cycles them)
maps_dir = tracks               ; every <maps_dir>/<name>/track.cfg is a selectable mesh map
scenery = 1                     ; mesh maps: draw render-only scenery
bake = 0                        ; 0 | 32 | 16: pre-bake the road band into float32 / 16-bit tiles (~313 / 188 MB, ~8 s load)

[display]
width = 1600
height = 900
fullscreen = 0
vsync = 0       ; physics is decoupled; vsync only affects rendering
fps_cap = 0     ; 0 = uncapped
msaa = 1
fov_v_deg = 50  ; vertical FOV. Ultrawide 21:9 single screen: keep vertical FOV, horizontal follows aspect
triple = 0      ; 1 = triple-screen projection (cockpit cam): window spans the three monitors
triple_side_deg = 0 ; yaw of the side screens; 0 = auto (panel horizontal FOV + bezel)
bezel_deg = 1.5
force_arrows = 1

[camera]
mode = chase    ; chase | cockpit | wheel | orbit | tv
chase_dist = 6.0
chase_height = 1.8
cockpit_dx = -0.62  ; eye offset from steering-wheel centre (m, car axes: x fwd, y left, z up)
cockpit_dy = 0.0
cockpit_dz = 0.30
cockpit_pitch_deg = -7

[input]
device = auto        ; auto | wheel | gamepad | keyboard
device_name =        ; substring of the SDL device name to pick a specific wheel
rotation_deg = 900   ; lock-to-lock rotation of YOUR wheel as set in its driver (1:1 mapping to the car's column)
steer_axis = 0
steer_invert = 0
throttle_axis = 1
throttle_invert = 1  ; most wheels report pedals released = +32767
brake_axis = 2
brake_invert = 1
clutch_axis = 3
clutch_invert = 1
handbrake_axis = -1
handbrake_invert = 0
pedal_deadzone = 0.02
steer_deadzone = 0.0
; H-shifter buttons (Logitech G29 + shifter defaults; check with the HUD 'input' line / your driver)
gear1_button = 12
gear2_button = 13
gear3_button = 14
gear4_button = 15
gear5_button = 16
gear6_button = 17
gear7_button = -1
reverse_button = 18
shift_up_button = 4
shift_down_button = 5
handbrake_button = -1
auto_clutch = -1     ; -1 auto (off when an H-shifter is configured), 0 manual, 1 auto
keyboard_hands_off = 1  ; release the steer keys and the wheel self-centres from caster/SAT alone
wheel_hands_k = 80   ; wheel input: column servo stiffness N m/rad (your arms) - only for non-FFB wheels
wheel_hands_d = 1.2
wheel_hands_tmax = 30

[ffb]
enabled = 1
gain = 1.0           ; output = gain * column torque / max_torque_nm
max_torque_nm = 8.0  ; column torque that maps to 100 % of your base
min_force = 0.04     ; deadband compensation (fraction), lifts small forces past wheel friction
invert = 0
smoothing_hz = 120   ; low-pass on the output (0 = off)

[audio]
enabled = 1
master = 0.8
engine = 1.0
tyres = 1.0
road = 1.0
wind = 1.0

[autopilot]
enabled = 0     ; O toggles
inside_offset = 4.8
lat_accel = 5.5
speed_cap = 33

[gamepad]
; stick = where your hands want the rim, linear over the FULL lock at every speed (no speed range, no expo/shaping).
; The rim is driven through a finite-strength "arms" impedance, so self-aligning torque still acts on it.
; Stick inside the deadzone = hands off the rim: the caster/SAT self-countersteer is free.
mode = arms             ; arms | raw (raw = stiffer legacy hands, k 25 / 15 N m)
arms_k = 10             ; N m/rad at the rim (relaxed grip)
arms_d = 1.0            ; N m s/rad
arms_tmax = 20          ; N m, strongest the arms push
deadzone = 0.04         ; stick jitter isolation only
grip_time = 0.08        ; s for the hands to close on the rim after the stick leaves the deadzone

[driver]
; plug-in driver (bot / script / Python over JSON lines, see docs/DRIVER_INTERFACE.md). G toggles it.
port = 0                ; >0 opens the TCP control port (or --drive-port N); 0 = off
bind = 127.0.0.1        ; keep loopback: any process that can reach the port can drive the car
arm_k = 25              ; N m/rad driver-wheel stiffness (measured 10-46, Xing et al. 2018)
arm_d = 1
arm_tmax = 20
delay = 0.18            ; s, human-like reaction delay of the bot's hands
bandwidth_hz = 3
preview_time = 0.75
yaw_damp = 0.06
catch_gain = 0.5
predict = 1.0
lat_ki = 0.002
takeover = 1            ; any deliberate human input releases the bot
takeover_stick = 0.25
takeover_wheel_deg = 45
takeover_pedal = 0.15
