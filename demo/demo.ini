; DriveChain test-drive configuration (paths are relative to the working directory)
[car]
ini = cars/mx5_na.ini         ; physical car (hardpoints, springs, tyres, steering, engine). The dist build uses the AC-calibrated miata_ac.ini
mesh_dir = private/miata_mesh  ; prepared by tools/prep_car_mesh.py (private, not in the repo); missing -> placeholder components
assist = -1                    ; -1 = from car ini, 0 = manual rack, 1 = hydraulic assist (H toggles live)

[physics]
substep_hz = 2000

[start]
s = 30          ; metres along the lap
d = 0           ; lateral offset (+ = left)
speed = 0

[track]
rough_scale = 1.0

[display]
width = 1600
height = 900
fullscreen = 0
vsync = 0       ; physics is decoupled; vsync only affects rendering
fps_cap = 0     ; 0 = uncapped
msaa = 1
fov_v_deg = 50  ; vertical FOV. Ultrawide 21:9 single screen: keep vertical FOV, horizontal follows aspect
triple = 0      ; 1 = triple-screen projection (cockpit cam): window spans the three monitors
triple_side_deg = 0 ; yaw of the side screens; 0 = auto (panel horizontal FOV + bezel)
bezel_deg = 1.5
force_arrows = 1

[camera]
mode = chase    ; chase | cockpit | wheel | orbit | tv
chase_dist = 6.0
chase_height = 1.8
cockpit_dx = -0.62  ; eye offset from steering-wheel centre (m, car axes: x fwd, y left, z up)
cockpit_dy = 0.0
cockpit_dz = 0.30
cockpit_pitch_deg = -7

[input]
device = auto        ; auto | wheel | gamepad | keyboard
device_name =        ; substring of the SDL device name to pick a specific wheel
rotation_deg = 900   ; lock-to-lock rotation of YOUR wheel as set in its driver (1:1 mapping to the car's column)
steer_axis = 0
steer_invert = 0
throttle_axis = 1
throttle_invert = 1  ; most wheels report pedals released = +32767
brake_axis = 2
brake_invert = 1
clutch_axis = 3
clutch_invert = 1
handbrake_axis = -1
handbrake_invert = 0
pedal_deadzone = 0.02
steer_deadzone = 0.0
; H-shifter buttons (Logitech G29 + shifter defaults; check with the HUD 'input' line / your driver)
gear1_button = 12
gear2_button = 13
gear3_button = 14
gear4_button = 15
gear5_button = 16
gear6_button = 17
gear7_button = -1
reverse_button = 18
shift_up_button = 4
shift_down_button = 5
handbrake_button = -1
auto_clutch = -1     ; -1 auto (off when an H-shifter is configured), 0 manual, 1 auto
keyboard_hands_off = 1  ; release the steer keys and the wheel self-centres from caster/SAT alone
wheel_hands_k = 80   ; wheel input: column servo stiffness N m/rad (your arms) - only for non-FFB wheels
wheel_hands_d = 1.2
wheel_hands_tmax = 30

[ffb]
enabled = 1
gain = 1.0           ; output = gain * column torque / max_torque_nm
max_torque_nm = 8.0  ; column torque that maps to 100 % of your base
min_force = 0.04     ; deadband compensation (fraction), lifts small forces past wheel friction
invert = 0
smoothing_hz = 120   ; low-pass on the output (0 = off)

[audio]
enabled = 1
master = 0.8
engine = 1.0
tyres = 1.0
road = 1.0
wind = 1.0

[autopilot]
enabled = 0     ; O toggles
inside_offset = 4.8
lat_accel = 5.5
speed_cap = 33
