[package]
name = "drivechain-native"
version = "0.1.0"
edition = "2021"
description = "DriveChain showcase, native high-end variant: Tarmac physics (C API) + Vulkan 1.3 (ash) renderer"
license = "MIT"
publish = false

[dependencies]
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
raw-window-handle = "0.6"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }
anyhow = "1"
gltf = { version = "1.4", default-features = false, features = ["import", "names", "extras", "utils"] }
serde_json = "1"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
font8x8 = "0.3"

[target.'cfg(not(windows))'.dependencies]
gilrs = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Devices_HumanInterfaceDevice", "Win32_UI_Input_XboxController", "Win32_System_LibraryLoader"] }

[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[features]
default = []
# DLSS Super Resolution / Ray Reconstruction through NVIDIA NGX. Needs DLSS_SDK=<path to NVIDIA DLSS SDK> at build time.
dlss = []

[profile.release]
debug = 1
opt-level = 3
[profile.dev.package."*"]
opt-level = 3
