; DriveChain car file. Units SI. Vehicle frame x fwd, y left, z up, origin = CG at design ride height.
; Hardpoints are for the LEFT corner; the right corner is mirrored.
[car]
solver = 1   ; 1 = coupled multibody core (dc_mb, default), 0 = legacy reduced 12-DOF core
mass = 1050   ; 990 kg factory curb weight (1990 NA 1.6 spec) + ~60 kg driver
sprung_inertia = 300, 1000, 1100
gravity = 9.81
substep_hz = 2000
road_resolve = 0.025
steer_ratio = 15
steer_lock_deg = 504
rack_mass = 3
sw_inertia = 0.035
column_inertia = 0.002
torsion_k = 1500
torsion_c = 0.15
rack_friction = 60
column_friction = 0.15
rack_stop_k = 2000000
rack_stop_c = 3000
assist = 1
assist_area = 0.00088
assist_pmax = 7000000
assist_tref = 3.5
assist_flow = 0.0001
assist_rpm_full = 1500
assist_damping = 1500
assist_torsion_k = 115
drive = 0
ngears = 5
gear_reverse = -3.758
final_drive = 4.3
engine_inertia = 0.12
gearbox_inertia = 0.02
coast_torque = 60
coast_rpm = 7200
idle_rpm = 850
limiter_rpm = 7200
clutch_torque = 260
diff_power = 0    ; ramp/clutch-pack lock unused: the 1990 option LSD was a viscous coupling (diff_viscous)
