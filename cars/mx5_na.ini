body_c = 4000
body_mu = 0.5
gears = 3.136, 1.888, 1.33, 1, 0.814

diff_viscous = 8   ; viscous-coupling LSD, N m per rad/s of axle-half speed difference (~85 N m at 100 rpm); estimate, no public NA coupling curve
